name: Deploy Brandbook Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brandbook-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish gh-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: brandbook-site/package-lock.json

      - name: Install brandbook dependencies
        working-directory: brandbook-site
        run: npm ci

      - name: Regenerate brand assets
        working-directory: brandbook-site
        run: npm run brand:assets

      - name: Build static brandbook
        working-directory: brandbook-site
        env:
          NEXT_PUBLIC_BASE_PATH: /FusionStructureBrand/
        run: npm run build:pages

      - name: Publish to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ../brandbook-pages-output
          mkdir -p ../brandbook-pages-output
          cp -a brandbook-site/dist-pages/. ../brandbook-pages-output/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan pages-publish
          git rm -rf .
          git clean -fdx

          cp -a ../brandbook-pages-output/. .
          touch .nojekyll
          git add -A
          git commit -m "deploy: brandbook ${GITHUB_SHA}"
          git push --force origin HEAD:gh-pages
