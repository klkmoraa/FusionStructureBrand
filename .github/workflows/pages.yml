name: Canon

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brand-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm run check

  publish:
    name: Publish gh-pages
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish static site
        shell: bash
        run: |
          set -euo pipefail
          out=../brand-pages
          mkdir -p "$out"
          cp -a index.html media svg tokens "$out"/
          touch "$out"/.nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan pages-publish
          git rm -rfq .
          git clean -fdxq
          cp -a "$out"/. .
          git add -A
          git commit -m "deploy: canon ${GITHUB_SHA}"
          git push --force origin HEAD:gh-pages
